name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v1.0.2.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"

      - name: Install system tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip unzip

      - name: Prepare Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/iimod/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/iimod/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release artifacts
        run: tools/release/build.sh "$RELEASE_TAG"

      - name: Verify release artifacts
        run: tools/release/verify.sh "dist/release/$RELEASE_TAG"

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/release/$RELEASE_TAG/$LINUX_BIN_NAME" \
            "dist/release/$RELEASE_TAG"/*.iimod \
            "dist/release/$RELEASE_TAG/ii-modules-starter-$RELEASE_TAG.zip" \
            "dist/release/$RELEASE_TAG/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "dist/release/$RELEASE_TAG/RELEASE_NOTES.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINUX_BIN_NAME: iimod-linux-x86_64
