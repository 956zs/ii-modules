name: Release iimod CLI

on:
  push:
    tags:
      - 'iimod/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing CLI tag, for example iimod/v1.1.0.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate CLI release contract
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == iimod/v* ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"
          cargo_version="$(cargo metadata --no-deps --manifest-path tools/iimod/Cargo.toml --format-version=1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tools/release/contract.sh cli "$RELEASE_TAG" "$cargo_version"

      - name: Prepare Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/iimod/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/iimod/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build CLI release
        run: tools/release/build.sh "$RELEASE_TAG"

      - name: Verify CLI release
        run: tools/release/verify.sh "dist/release/$RELEASE_TAG" "$RELEASE_TAG"

      - name: Publish CLI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_dir="dist/release/$RELEASE_TAG"
          release_flags=(--latest=false)
          version="${RELEASE_TAG##*/v}"
          precedence_version="${version%%+*}"
          [[ "$precedence_version" != *-* ]] || release_flags+=(--prerelease)
          gh release create "$RELEASE_TAG" \
            "$release_dir/iimod-linux-x86_64" \
            "$release_dir/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            "${release_flags[@]}" \
            --title "$RELEASE_TAG" \
            --notes-file "$release_dir/RELEASE_NOTES.md"
