name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip unzip nethogs

      - name: Prepare Rust
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            tools/iimod/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/iimod/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --manifest-path tools/iimod/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path tools/iimod/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: timeout 60 cargo test --manifest-path tools/iimod/Cargo.toml

      - name: Test module contracts
        run: node --test modules/*/tests/*.test.mjs

      - name: Check release scripts
        run: |
          bash -n tools/release/*.sh
          tools/release/test-contracts.sh
          tools/release/test-publish.sh
