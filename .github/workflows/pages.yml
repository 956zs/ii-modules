name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'modules/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Release module', 'Release iimod CLI']
    types: [completed]
  release:
    types: [published, unpublished, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Fetch all GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/releases"
          gh api --paginate --slurp \
            --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RUNNER_TEMP/releases/pages.json"
          page_count="$(jq 'length' "$RUNNER_TEMP/releases/pages.json")"
          test "$page_count" -gt 0
          for ((page = 0; page < page_count; page++)); do
            jq ".[$page]" "$RUNNER_TEMP/releases/pages.json" \
              > "$RUNNER_TEMP/releases/page-$((page + 1)).json"
          done
          printf 'RELEASE_PAGES=%s\n' "$(find "$RUNNER_TEMP/releases" -type f -name 'page-*.json' -print | sort -V | paste -sd, -)" >> "$GITHUB_ENV"

      - name: Project independent releases
        run: |
          set -euo pipefail
          npm --prefix site run releases:project -- \
            --releases "$RELEASE_PAGES" \
            --index-output dist/index.json \
            --cli-output dist/downloads/iimod/linux-x86_64
          test -s site/dist/index.json
          test -s site/dist/downloads/iimod/linux-x86_64
          test -s site/dist/downloads/iimod/linux-x86_64.sha256

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
