[package]
name = "iimod"
version = "1.0.0"
edition = "2021"
description = "IIMP module manager for the illogical-impulse Quickshell config"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
libc = "0.2.186"
regex = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
walkdir = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
